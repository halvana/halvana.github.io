<!-- Footer -->
<footer class="footer" id="footer" style="background-color: #ffffff; padding: 30px 0;">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-4 text-center text-md-left">
        <span class="copyright text-muted small">Copyright &copy; Halvana Tech {{ 'now' | date: "%Y" }}. All Rights Reserved.</span>
      </div>
      <!-- Social Media -->
      <div class="col-md-4 text-center my-3 my-md-0">
        <ul class="list-inline social-buttons mb-0">
          {% for link in site.data.sitetext[site.locale].footer.social %}
          <li class="list-inline-item">
            {% if link.url %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">
              {% if link.icon %}<i class="{{ link.icon }}"></i>{% endif %}
            </a>
            {% endif %}
          </li>
          {% endfor %}
        </ul>
      </div>
      <!-- Legal / Brand Motto -->
      <div class="col-md-4 text-center text-md-right">
        <span class="small text-muted font-weight-bold" style="letter-spacing: 1px;">FOCUS &bull; CLARITY &bull; OWNERSHIP</span>
      </div>
    </div>
  </div>
</footer>
