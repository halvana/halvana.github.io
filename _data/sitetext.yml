en: &DEFAULT_EN
  header:
    title: Vision made easier
    text: Smart TV, Display, Digital KIOSK
    button: Discuss Your Project
    buttonlink: "#contact"

  about:
    title: "About Halvana Tech"
    text: "Engineering Expertise. Focused Execution."
    body: "Established in 2025, Halvana Tech is a project-based engineering services company focused on **Smart TVs**, **Display Boards**, and **Interactive Kiosks**.<br><br>Our foundation comes from approximately **nine years of professional industry experience** across multimedia platforms, AOSP, Android systems, and embedded engineering.<br><br>We work with product manufacturers and technology teams to address software, hardware integration, interoperability, validation, and product-level engineering challenges.<br><br>Our approach is simple: **stay focused on the problem, communicate with clarity, and take ownership of the engineering work**."
    section: about

  services:
    title: "Our Services"
    text: "Three focused engineering pillars for connected display and embedded products."
    section: services
    list:
      - title: "Software Engineering (SW)"
        desc: "Embedded software, operating systems, multimedia, and connectivity. Capabilities include AOSP and Android TV platform development, embedded Linux, HAL and device drivers, HDMI-CEC implementation, ARC/eARC integration, Wi-Fi/Bluetooth, media streaming (HLS, MPEG-DASH, RTSP), and OTA update mechanisms."
        icon: fas fa-laptop-code
      - title: "Hardware Engineering (HW)"
        desc: "Product-level hardware integration and hardware-software interoperability. Capabilities include HDMI interface integration, display panel bring-up, wireless module integration, USB, UART, I2C, SPI interfaces, touchscreen integration, kiosk peripheral interfacing, and board-level troubleshooting."
        icon: fas fa-microchip
      - title: "Compliance, Testing & Support (CTS)"
        desc: "Engineering validation, interoperability testing, and continuous technical support. Capabilities include HDMI functionality and CEC command validation, ARC/eARC audio testing, wireless connectivity validation, audio/video playback testing, functional and regression testing, and root-cause defect analysis."
        icon: fas fa-clipboard-check

  portfolio:
    title: "Products We Support"
    text: "Specialised engineering expertise across three core connected product categories."
    section: portfolio
    closebutton: "Close Details"

  timeline:
    title: "Our Engineering Approach"
    text: "A structured, four-stage execution process built on Focus, Clarity, and Ownership."
    section: approach
    events:
      - title: "Understand"
        year: "01"
        desc: "Analyze product requirements, target hardware architectures, protocol specifications, and core engineering challenges."
        image: assets/img/timeline/1.jpg
      - title: "Define"
        year: "02"
        desc: "Establish clear technical scope, identify dependencies, clarify deliverables, and define the technical approach."
        image: assets/img/timeline/2.jpg
      - title: "Engineer"
        year: "03"
        desc: "Execute embedded development, hardware integration, protocol implementation, and low-level system debugging."
        image: assets/img/timeline/3.jpg
      - title: "Validate & Deliver"
        year: "04"
        desc: "Perform comprehensive interoperability testing, resolve technical issues, document outcomes, and deliver production-ready code."
        image: assets/img/timeline/4.jpg
    end: "FOCUS.<br>CLARITY.<br>OWNERSHIP."

